{% load static %}

<!-- Chatbot Widget Flotante -->
<link rel="stylesheet" href="{% static 'css/chatbot/widget.css' %}" />

<div id="chatbotWidget" class="chatbot-widget">
  <!-- Botón para abrir/cerrar el chat -->
  <button
    id="chatbotToggle"
    class="chatbot-toggle"
    title="Abrir ChatBot Médico"
  >
    <i class="fas fa-robot"></i>
    <span class="pulse-ring"></span>
  </button>

  <!-- Ventana del chat -->
  <div id="chatbotWindow" class="chatbot-window">
    <div class="chatbot-header">
      <div class="chatbot-title">
        <i class="fas fa-robot"></i>
        <span>ChatBot Médico</span>
      </div>
      <div class="chatbot-controls">
        <button
          id="chatbotMinimize"
          class="chatbot-control-btn"
          title="Minimizar"
        >
          <i class="fas fa-minus"></i>
        </button>
        <button id="chatbotClose" class="chatbot-control-btn" title="Cerrar">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <div class="chatbot-body">
      <div class="chatbot-messages" id="chatbotMessages">
        <div class="message bot">
          <div class="message-avatar">🤖</div>
          <div class="message-bubble">
            ¡Hola! Soy tu asistente médico. Puedo ayudarte con:
            <div class="mt-2 space-y-1">
              <div class="flex items-center text-sm">
                <span class="mr-2">🩺</span> Información de pacientes
              </div>
              <div class="flex items-center text-sm">
                <span class="mr-2">📅</span> Consulta de citas
              </div>
              <div class="flex items-center text-sm">
                <span class="mr-2">👨‍⚕️</span> Datos de doctores
              </div>
              <div class="flex items-center text-sm">
                <span class="mr-2">💊</span> Stock de medicamentos
              </div>
              <div class="flex items-center text-sm">
                <span class="mr-2">📊</span> Estadísticas
              </div>
            </div>
            <div class="mt-3 p-2 bg-blue-50 rounded-lg">
              <div class="text-sm text-blue-800">
                <strong>💡 Prueba decir:</strong><br />
                "¿Cuántos pacientes hay?" o<br />
                "Busca paciente con cédula 1234567890"
              </div>
            </div>
          </div>
        </div>

        <div class="typing-indicator">
          <div class="message-avatar">🤖</div>
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>

      <div class="chatbot-input">
        <div class="chatbot-input-group">
          <button id="chatbotVoiceBtn" class="chatbot-voice-btn" title="Hablar">
            <i class="fas fa-microphone"></i>
          </button>
          <input
            type="text"
            id="chatbotInput"
            class="chatbot-input-field"
            placeholder="Escribe tu consulta..."
          />
          <button id="chatbotSendBtn" class="chatbot-send-btn" title="Enviar">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Estado de voz -->
<div id="chatbotVoiceStatus" class="chatbot-voice-status">
  <i class="fas fa-microphone"></i>
  <span>Escuchando...</span>
</div>

<style>
  /* Estilos del Widget Chatbot */
  .chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, sans-serif;
  }

  .chatbot-toggle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
  }

  .chatbot-toggle.active {
    background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
  }

  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    border: 3px solid #667eea;
    border-radius: 50%;
    animation: pulse 2s infinite;
    opacity: 0;
  }

  @keyframes pulse {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.5);
    }
  }

  .chatbot-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 380px;
    height: 500px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideInUp 0.3s ease;
  }

  .chatbot-window.show {
    display: flex;
  }

  .chatbot-window.minimized {
    height: 50px;
    overflow: hidden;
  }

  @keyframes slideInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .chatbot-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
  }

  .chatbot-title {
    display: flex;
    align-items: center;
    font-weight: 600;
    font-size: 16px;
  }

  .chatbot-title i {
    margin-right: 8px;
  }

  .chatbot-controls {
    display: flex;
    gap: 5px;
  }

  .chatbot-control-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chatbot-control-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
  }

  .chatbot-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f8f9fa;
    max-height: 350px;
  }

  .chatbot-messages::-webkit-scrollbar {
    width: 4px;
  }

  .chatbot-messages::-webkit-scrollbar-track {
    background: #f1f1f1;
  }

  .chatbot-messages::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 4px;
  }

  .chatbot-messages::-webkit-scrollbar-thumb:hover {
    background: #555;
  }

  .message {
    display: flex;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .message.user {
    justify-content: flex-end;
  }

  .message.bot {
    justify-content: flex-start;
  }

  .message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin: 0 8px;
    flex-shrink: 0;
  }

  .message.user .message-avatar {
    background: #007bff;
    color: white;
    order: 1;
  }

  .message.bot .message-avatar {
    background: #28a745;
    color: white;
  }

  .message-bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .message.user .message-bubble {
    background: #007bff;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .message.bot .message-bubble {
    background: white;
    color: #333;
    border: 1px solid #e9ecef;
    border-bottom-left-radius: 4px;
  }

  .message-bubble ul {
    margin: 8px 0 0 0;
    padding-left: 16px;
  }

  .message-bubble li {
    margin: 4px 0;
    font-size: 13px;
  }

  .space-y-1 > * + * {
    margin-top: 0.25rem;
  }

  .bg-blue-50 {
    background-color: #eff6ff;
  }

  .text-blue-800 {
    color: #1e40af;
  }

  .rounded-lg {
    border-radius: 0.5rem;
  }

  .typing-indicator {
    display: none;
    align-items: center;
    margin-bottom: 12px;
  }

  .typing-indicator.show {
    display: flex;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    margin-left: 8px;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6c757d;
    animation: typing 1.4s infinite;
  }

  .typing-dot:nth-child(2) {
    animation-delay: 0.2s;
  }

  .typing-dot:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes typing {
    0%,
    60%,
    100% {
      transform: translateY(0);
    }
    30% {
      transform: translateY(-8px);
    }
  }

  .chatbot-input {
    padding: 15px;
    background: white;
    border-top: 1px solid #e9ecef;
  }

  .chatbot-input-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .chatbot-input-field {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #dee2e6;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
  }

  .chatbot-input-field:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
  }

  .chatbot-voice-btn,
  .chatbot-send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .chatbot-voice-btn {
    background: #28a745;
    color: white;
  }

  .chatbot-voice-btn:hover {
    background: #218838;
    transform: scale(1.1);
  }

  .chatbot-voice-btn.recording {
    background: #dc3545;
    animation: pulse-voice 1s infinite;
  }

  @keyframes pulse-voice {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  .chatbot-send-btn {
    background: #007bff;
    color: white;
  }

  .chatbot-send-btn:hover {
    background: #0056b3;
    transform: scale(1.1);
  }

  .chatbot-send-btn:disabled {
    background: #6c757d;
    cursor: not-allowed;
    transform: none;
  }

  .chatbot-voice-status {
    position: fixed;
    bottom: 100px;
    right: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 9998;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .chatbot-voice-status.show {
    display: flex;
  }

  .chatbot-voice-status i {
    animation: pulse-voice 1s infinite;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .chatbot-window {
      width: 100vw;
      height: 100vh;
      bottom: 0;
      right: 0;
      border-radius: 0;
      position: fixed;
    }

    .chatbot-toggle {
      width: 55px;
      height: 55px;
      font-size: 22px;
    }

    .chatbot-messages {
      max-height: none;
    }
  }

  /* Animaciones de entrada */
  .message {
    animation: messageSlideIn 0.3s ease;
  }

  @keyframes messageSlideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Error styles */
  .error-message {
    background: #f8d7da !important;
    color: #721c24 !important;
    border: 1px solid #f5c6cb !important;
  }

  .success-message {
    background: #d4edda !important;
    color: #155724 !important;
    border: 1px solid #c3e6cb !important;
  }
</style>

<script>
  class ChatbotWidget {
    constructor() {
      this.isOpen = false;
      this.isMinimized = false;
      this.isRecording = false;
      this.recognition = null;
      this.currentConversationId = null;
      this.init();
    }

    init() {
      this.setupEventListeners();
      this.initSpeechRecognition();
      this.loadChatbotPosition();
    }

    setupEventListeners() {
      // Toggle chatbot
      document.getElementById("chatbotToggle").addEventListener("click", () => {
        this.toggleChatbot();
      });

      // Minimize/Close
      document
        .getElementById("chatbotMinimize")
        .addEventListener("click", () => {
          this.minimizeChatbot();
        });

      document.getElementById("chatbotClose").addEventListener("click", () => {
        this.closeChatbot();
      });

      // Send message
      document
        .getElementById("chatbotSendBtn")
        .addEventListener("click", () => {
          this.sendMessage();
        });

      document
        .getElementById("chatbotInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") this.sendMessage();
        });

      // Voice recognition
      document
        .getElementById("chatbotVoiceBtn")
        .addEventListener("click", () => {
          this.toggleVoiceRecognition();
        });

      // Drag functionality
      this.makeDraggable();

      // Click outside to close
      document.addEventListener("click", (e) => {
        if (
          !e.target.closest(".chatbot-widget") &&
          this.isOpen &&
          !this.isMinimized
        ) {
          // this.closeChatbot(); // Comentado para no cerrar al hacer click fuera
        }
      });
    }

    toggleChatbot() {
      const toggle = document.getElementById("chatbotToggle");
      const window = document.getElementById("chatbotWindow");

      if (this.isOpen) {
        this.closeChatbot();
      } else {
        this.openChatbot();
      }
    }

    openChatbot() {
      const toggle = document.getElementById("chatbotToggle");
      const window = document.getElementById("chatbotWindow");

      this.isOpen = true;
      this.isMinimized = false;

      toggle.classList.add("active");
      window.classList.add("show");
      window.classList.remove("minimized");

      // Focus input
      setTimeout(() => {
        document.getElementById("chatbotInput").focus();
      }, 300);
    }

    closeChatbot() {
      const toggle = document.getElementById("chatbotToggle");
      const window = document.getElementById("chatbotWindow");

      this.isOpen = false;
      this.isMinimized = false;

      toggle.classList.remove("active");
      window.classList.remove("show");
      window.classList.remove("minimized");
    }

    minimizeChatbot() {
      const window = document.getElementById("chatbotWindow");

      this.isMinimized = !this.isMinimized;

      if (this.isMinimized) {
        window.classList.add("minimized");
      } else {
        window.classList.remove("minimized");
      }
    }

    initSpeechRecognition() {
      if (
        "webkitSpeechRecognition" in window ||
        "SpeechRecognition" in window
      ) {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        this.recognition = new SpeechRecognition();
        this.recognition.lang = "es-ES";
        this.recognition.continuous = false;
        this.recognition.interimResults = false;

        this.recognition.onstart = () => {
          this.isRecording = true;
          this.updateVoiceButton();
          this.showVoiceStatus();
        };

        this.recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById("chatbotInput").value = transcript;
          this.hideVoiceStatus();
          setTimeout(() => this.sendMessage(), 500);
        };

        this.recognition.onerror = (event) => {
          console.error("Error de reconocimiento de voz:", event.error);
          this.hideVoiceStatus();
          this.isRecording = false;
          this.updateVoiceButton();
        };

        this.recognition.onend = () => {
          this.isRecording = false;
          this.updateVoiceButton();
          this.hideVoiceStatus();
        };
      } else {
        console.warn("Reconocimiento de voz no soportado");
        document.getElementById("chatbotVoiceBtn").style.display = "none";
      }
    }

    toggleVoiceRecognition() {
      if (!this.recognition) return;

      if (this.isRecording) {
        this.recognition.stop();
      } else {
        this.recognition.start();
      }
    }

    updateVoiceButton() {
      const voiceBtn = document.getElementById("chatbotVoiceBtn");
      if (this.isRecording) {
        voiceBtn.classList.add("recording");
        voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
      } else {
        voiceBtn.classList.remove("recording");
        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
      }
    }

    showVoiceStatus() {
      const status = document.getElementById("chatbotVoiceStatus");
      status.classList.add("show");
    }

    hideVoiceStatus() {
      const status = document.getElementById("chatbotVoiceStatus");
      status.classList.remove("show");
    }

    async sendMessage() {
      const input = document.getElementById("chatbotInput");
      const message = input.value.trim();

      if (!message) return;

      // Mostrar mensaje del usuario
      this.addMessage(message, "user");
      input.value = "";

      // Mostrar indicador de escritura
      this.showTypingIndicator();

      try {
        const response = await fetch("/chatbot/api/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": this.getCsrfToken(),
          },
          body: JSON.stringify({
            message: message,
            conversation_id: this.currentConversationId,
          }),
        });

        const data = await response.json();

        if (data.success) {
          this.hideTypingIndicator();
          this.addMessage(data.response, "bot");
          this.currentConversationId = data.conversation_id;
        } else {
          this.hideTypingIndicator();
          this.addMessage("Error: " + data.error, "bot", true);
        }
      } catch (error) {
        this.hideTypingIndicator();
        this.addMessage(
          "Error de conexión. Por favor intenta nuevamente.",
          "bot",
          true
        );
        console.error("Error:", error);
      }
    }

    addMessage(text, sender, isError = false) {
      const messagesContainer = document.getElementById("chatbotMessages");
      const messageDiv = document.createElement("div");
      messageDiv.className = `message ${sender}`;

      const avatar = sender === "user" ? "👤" : "🤖";
      const bubbleClass = isError
        ? "message-bubble error-message"
        : "message-bubble";

      messageDiv.innerHTML = `
            <div class="message-avatar">${avatar}</div>
            <div class="${bubbleClass}">${this.formatMessage(text)}</div>
        `;

      // Insertar antes del indicador de escritura
      const typingIndicator =
        messagesContainer.querySelector(".typing-indicator");
      messagesContainer.insertBefore(messageDiv, typingIndicator);

      // Scroll al final
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    formatMessage(text) {
      return text
        .replace(/\n/g, "<br>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/`(.*?)`/g, "<code>$1</code>");
    }

    showTypingIndicator() {
      const indicator = document.querySelector(
        "#chatbotMessages .typing-indicator"
      );
      indicator.classList.add("show");
      document.getElementById("chatbotMessages").scrollTop =
        document.getElementById("chatbotMessages").scrollHeight;
    }

    hideTypingIndicator() {
      const indicator = document.querySelector(
        "#chatbotMessages .typing-indicator"
      );
      indicator.classList.remove("show");
    }

    makeDraggable() {
      const header = document.querySelector(".chatbot-header");
      const widget = document.getElementById("chatbotWidget");
      let isDragging = false;
      let startX, startY, startRight, startBottom;

      header.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;

        const rect = widget.getBoundingClientRect();
        startRight = window.innerWidth - rect.right;
        startBottom = window.innerHeight - rect.bottom;

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });

      function onMouseMove(e) {
        if (!isDragging) return;

        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        const newRight = startRight - deltaX;
        const newBottom = startBottom - deltaY;

        widget.style.right =
          Math.max(0, Math.min(newRight, window.innerWidth - 100)) + "px";
        widget.style.bottom =
          Math.max(0, Math.min(newBottom, window.innerHeight - 100)) + "px";
      }

      function onMouseUp() {
        isDragging = false;
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
      }
    }

    loadChatbotPosition() {
      const savedPosition = localStorage.getItem("chatbotPosition");
      if (savedPosition) {
        const { right, bottom } = JSON.parse(savedPosition);
        const widget = document.getElementById("chatbotWidget");
        widget.style.right = right + "px";
        widget.style.bottom = bottom + "px";
      }
    }

    getCsrfToken() {
      const tokenElement = document.querySelector("[name=csrfmiddlewaretoken]");
      return tokenElement ? tokenElement.value : "";
    }
  }

  // Inicializar el widget cuando se carga la página
  document.addEventListener("DOMContentLoaded", () => {
    new ChatbotWidget();
  });
</script>
